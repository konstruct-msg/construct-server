global:
  scrape_interval: 15s
  evaluation_interval: 15s

# alerts.yml was mounted into this container from the start and never loaded:
# without `rule_files` Prometheus does not know it exists, so RedisMemoryCritical
# had never evaluated once. The file being present is not the same as the rule
# running — this line is what makes the difference.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Targets are the port a service actually serves /metrics on. That is PORT for
  # most services (the axum router carrying health + metrics binds bind_address),
  # and METRICS_PORT only where the service reads it — group and signalling, whose
  # PORT is the gRPC port instead. Getting this wrong is silent: a bad target just
  # sits DOWN, which is why TargetDown is now an alert.
  - job_name: identity
    static_configs:
      - targets: ["identity:8081"] # was "auth:8081" — the service was renamed and
                                   # this job had been DOWN ever since

  - job_name: messaging
    static_configs:
      - targets: ["messaging:8083"]

  - job_name: media
    static_configs:
      - targets: ["media:8087"]

  - job_name: key
    static_configs:
      - targets: ["key:8057"] # KEY_SERVICE_HTTP_ADDR default

  - job_name: group
    static_configs:
      - targets: ["group:8097"] # METRICS_PORT; PORT=50058 is gRPC

  - job_name: signaling
    static_configs:
      - targets: ["signaling:8091"] # METRICS_PORT; PORT=50060 is gRPC

  # Gateway serves both the HTTP API and the VEIL relay — relay metrics are
  # published on the same /metrics endpoint (shared Prometheus registry).
  - job_name: gateway
    static_configs:
      - targets: ["gateway:3000"]

  # The Redis alerts have always referenced redis_memory_used_bytes, and this
  # scrape did not exist — the exporter ran and nobody read it. Redis is the
  # system's real capacity ceiling (maxmemory 512mb, noeviction, 30-day offline
  # retention), so this is the most load-bearing target here.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Host CPU / memory / disk. Without it there is no way to answer "is it time to
  # scale" with anything but a guess.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
