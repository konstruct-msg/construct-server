# =============================================================================
# Construct Server — Prometheus alert rules
# =============================================================================
# Loaded via `rule_files` in prometheus.yml and routed to a human by Alertmanager.
#
# Both of those were untrue until 2026-08-12: this file was mounted into the
# Prometheus container but `rule_files` was never set, so not one rule here had
# ever evaluated — while this header claimed otherwise. A rule that is written
# where it is read, not where it runs, is a comment.
#
# The Redis rules exist because this Redis is not a pure cache — it holds the
# offline delivery queues. Running it `noeviction` converts "silently drop a
# user's queued messages" into "reject writes loudly", which is only an
# improvement if someone sees the pressure building first.
# =============================================================================

groups:
  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is unreachable"
          description: >
            Offline delivery queues, rate limits and caches are all in this instance.
            Sealed sends — which is all ordinary messaging — STOP: under
            MSG_STEALTH_TOKEN_POLICY=enforce the intake lookup returns `unrecognised`
            and the token redemption returns `redis_error`, neither of which is an
            accept, so every envelope is refused. This description said sends continue
            until 2026-09-13; that was true under `warn` and stopped being true the day
            enforce was switched on. See AnonymousDoorRefusingEverything below.

      # Not an incident — a planning trigger, and the only observer the hardening
      # ladder's rung 55.5 has. That rung ("split the mailbox off this instance, then
      # replicate") is deliberately gated on a number rather than a date, because the
      # mailbox and the rate-limit keys share one memory budget while having opposite
      # loss policies. But a threshold nobody watches for is a date with extra steps:
      # written down at 12.3% usage, the next reading would have been whenever someone
      # thought to look, and the alerts that do exist start at 75% — sixty points past
      # the moment the work was supposed to begin, and by then it is an incident.
      - alert: RedisMailboxSplitTrigger
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.60
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Redis above 60% of maxmemory — start the mailbox split (ladder 55.5)"
          description: >
            Offline mailbox and rate-limit keys share this instance's memory and have
            different loss policies. Plan of record: decisions/harden-in-place-execution-plan.md
            rung 55.5. This is the trigger to begin, not an outage — RedisMemoryPressure
            at 75% is where it becomes urgent.

      # Leading indicator. With noeviction, hitting 100% means writes start failing —
      # including offline-queue writes — so this must be acted on before it gets there.
      - alert: RedisMemoryPressure
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis above 75% of maxmemory"
          description: >
            At 100% Redis rejects writes (noeviction). Check for an abandoned offline
            queue or raise maxmemory — the box has headroom.

      - alert: RedisMemoryCritical
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis above 90% of maxmemory — writes will start failing"

      # Should be flat at zero forever now. Any movement means either the policy was
      # changed back to an evicting one, or Redis is evicting despite noeviction —
      # both mean queued messages can disappear without an error.
      - alert: RedisKeysEvicted
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Redis evicted keys — offline messages may have been dropped"
          description: >
            With maxmemory-policy=noeviction this should be impossible. Check the
            running config: `redis-cli config get maxmemory-policy`.

  - name: sentinel
    rules:
      # The limiter degrading is by design (better than refusing every send), but it
      # means limits are approximate and per-instance while it lasts.
      - alert: SentinelRateLimitDegraded
        expr: increase(construct_msg_abuse_fail_open_total{control=~"sentinel_.*_quota"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sentinel rate limiting is running on per-instance fallback counters"
          description: >
            Redis is not answering the quota path. The circuit breaker recovers on its
            own once Redis returns; sustained firing means it is not returning.

      # The fallback table is full, so degraded mode has stopped limiting anything.
      - alert: SentinelDegradedUntracked
        expr: increase(construct_msg_abuse_fail_open_total{control="sentinel_degraded_untracked"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Degraded rate limiter is at capacity — sends are passing uncounted"
          description: >
            Reaching 50k tracked keys needs 50k verified devices. Treat as a possible
            abuse campaign coinciding with a Redis outage.

  # ── Is the wiring itself alive ──────────────────────────────────────────────
  #
  # A wrong scrape target is silent: the job simply sits DOWN and every alert
  # depending on it stays green forever because it has no data. `auth:8081`
  # pointed at a service renamed to `identity` and nobody noticed; the Redis
  # exporter was never scraped at all, which meant the memory alerts below could
  # not have fired even once. This alert makes that class loud.
  # ── The unauthenticated sealed-sender door ──────────────────────────────────
  # SendSealedMessage deliberately skips extract_authed_user_id. Everything that
  # limits a stranger on that path lives in Redis, and until 2026-09-13 every one
  # of these controls could disengage without anyone being told: the fail-open
  # counters were on a Grafana panel and on no alert. A control that turns itself
  # off quietly is not a control.
  - name: sealed_door
    rules:
      # The per-IP window is the only thing between a stranger's socket and the
      # parser. On a Redis error `check_sealed_ip_limit` returns Allow.
      - alert: SealedDoorRateLimitFailOpen
        expr: increase(construct_msg_abuse_fail_open_total{control="sealed_ip"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Per-IP limit on the anonymous send path is not being applied"
          description: >
            Redis is not answering the sealed-sender rate-limit path, so sends are
            passing that gate uncounted. On its own this is survivable — the token
            gate behind it fails closed — but the two together mean the door is in
            an unmeasured state, and a burst during this window is invisible.

      # Second fail-open on the same path, same outage, different consequence:
      # replays are delivered again instead of being dropped.
      - alert: DeliveryTagReplayCheckFailOpen
        expr: increase(construct_msg_abuse_fail_open_total{control="delivery_tag"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Sealed-sender replay check is not being applied"
          description: >
            The delivery-tag cache is unavailable, so a captured envelope replayed now
            is delivered a second time. Deliberately fail-open: a Redis outage must not
            drop messages. Bounded by how long this fires.

      # The other direction, and the more expensive one. `redis_error` is not an
      # accept, so under enforce this is not a rate limit doing its job — it is
      # ordinary traffic between established contacts being refused.
      - alert: AnonymousDoorRefusingEverything
        expr: >
          increase(construct_stealth_token_check_total{mode="enforce",result="redis_error"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Enforce is refusing sealed sends because Redis cannot answer"
          description: >
            Not abuse: the anti-abuse state store is unreachable and enforce treats
            "cannot check" as "reject". All sealed messaging is down for as long as
            this fires, and clients answer each rejection with a forced wallet
            replenish that clears their back-off, so identity-service load rises while
            this is happening. Check RedisDown first. Emergency lever:
            MSG_STEALTH_TOKEN_POLICY=warn.

      # Not a Redis story. A jump in `unrecognised` means senders and this server
      # disagree about which intake tags are live — the epoch rollover at 00:00 UTC
      # is where that happens, and under enforce the cost of disagreeing is a
      # refused envelope rather than a charged token.
      - alert: IntakeCredentialsNotRecognised
        expr: >
          sum(rate(construct_msg_intake_check_total{result="unrecognised"}[15m]))
            / clamp_min(sum(rate(construct_msg_intake_check_total[15m])), 0.001) > 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of intake credentials are not recognised"
          description: >
            Senders are presenting tags this server does not hold. Suspect the daily
            epoch boundary (floor(unix/86400), grace of one epoch) or a publish window
            that stopped being refreshed. Measured 2026-09-11 on the first live pair:
            17 vouched, 2 absent, 0 unrecognised.

  - name: observability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: >
            {{ $labels.job }} ({{ $labels.instance }}) has not answered a scrape for
            5 minutes. Either the service is down or the target is wrong — check the
            port it actually serves /metrics on. PORT for most services, METRICS_PORT
            for group and signalling.

  # ── Cutover gates: the conditions the hardening ladder flips on ─────────────
  #
  # Each rung of decisions/harden-in-place-execution-plan.md is gated on a number,
  # and every one of those numbers was until now something a person had to remember
  # to go and read. A gate with no observer is not a gate; and these particular
  # flips are one-way (55.1 is compile-time, so it ships as a release and cannot be
  # rolled back by config), which is exactly when finding out late is expensive.
  - name: cutover_gates
    rules:
      # The blocker for MSG_MAILBOX_USER_WRITE=0 (rung 55.3). Every entry counted here
      # is a message the cutover would have dropped: it was delivered only because the
      # legacy per-user stream is still written and still read, so the per-device
      # stream is not yet complete. The exit criterion is a flat zero across the gate
      # window — which means a single tick has to be visible when it happens, not at
      # the end of seven days when someone graphs it.
      - alert: MailboxCutoverBlocked
        expr: increase(construct_msg_mailbox_user_only_entries_total[1h]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Per-device mailbox is incomplete — 55.3 gate window restarts"
          description: >
            A delivered entry ({{ $labels.path }}) was missing from the per-device stream.
            MSG_MAILBOX_USER_WRITE=0 would have dropped it. The seven-day zero window
            starts again from now.

  # ── Capacity: the triggers for scaling, so the answer is not a guess ────────
  - name: capacity
    rules:
      # Disk fills from media (7-day retention) and Postgres. 25% free is the last
      # comfortable moment to move media to object storage rather than the first
      # panicked one.
      - alert: DiskFillingUp
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Less than 25% disk free on {{ $labels.mountpoint }}"
          description: >
            Media retention is 7 days from upload and downloads do not extend it, so
            steady growth here means arrival rate exceeded expiry rate. This is the
            trigger to move media to S3-compatible storage.

      - alert: DiskCritical
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% disk free on {{ $labels.mountpoint }}"

      - alert: HostMemoryPressure
        expr: >
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host has under 15% memory available"
          description: >
            Vertical upgrade before splitting Postgres or Redis onto their own host —
            a network hop on every query is a worse trade below a few thousand users.

      # Load per core, not raw load: the same number means nothing without the
      # core count.
      - alert: HostLoadSustained
        expr: >
          node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "15-minute load above 1.5 per core for half an hour"
          description: >
            Sustained, not spiky. Look for a cause before adding cores — server-side
            crypto is not the workload here, so CPU pressure usually means something
            is looping.

      - alert: PostgresConnectionsHigh
        expr: >
          sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.70
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Postgres above 70% of max_connections"
          description: >
            Add pgbouncer before moving Postgres to its own host — connection
            exhaustion is almost always pooling, not capacity.

