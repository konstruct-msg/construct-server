# ============================================================================
# Coturn — backup call relay, TLS only, behind an SNI demux on :443
# ============================================================================
#
# For a host that already serves HTTPS on :443 through an SNI router (nginx
# `stream` + `ssl_preread`, or similar) and must not open anything else. coturn
# listens on loopback only; the router hands it the connections whose SNI is
# this relay's name. Outside: no 3478, no 5349, no DTLS — only the UDP relay
# ports coturn allocates, which answer nobody without a permission.
#
# signaling lists such a relay as an explicit URL in TURN_HOSTS (the compose .env
# on the prod host, not this repo and not app.env — `environment:` overrides it):
#   TURN_HOSTS=turn.ams.konstruct.cc,turns:<RELAY_NAME>:443?transport=tcp
# A bare host would be expanded to 3478/5349 as well — ports this relay never
# opens (signaling-service/src/turn.rs).
#
# Install: as turnserver-prod.conf (coturn, drop-in with LogsDirectory=coturn,
# /etc/logrotate.d/coturn, ufw 49152:65535/udp). Then:
#   - SNI router: map <RELAY_NAME> → 127.0.0.1:5349, and exclude those sessions
#     from its access log (coturn's log is the one with a stated retention).
#   - Cert: whatever issues the host's other certs (webroot on :80). coturn runs
#     as `turnserver` and must read the files; copy them with
#     `install -m 640 -o root -g turnserver` and `systemctl kill -s SIGUSR2 coturn`
#     from the renewal hook. Cert and realm carry the host's own name — nothing
#     here says what the relay is for.
# ============================================================================

listening-ip=127.0.0.1
tls-listening-port=5349
no-udp
no-tcp
no-dtls
no-tcp-relay

# Relay sockets go on the public address. Behind NAT use external-ip instead.
relay-ip=<PUBLIC_IP>

realm=<HOST_DOMAIN>

# TURN REST credentials — same TURN_SECRET as signaling-service.
use-auth-secret
static-auth-secret=CHANGEME_SAME_AS_TURN_SECRET

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
no-tlsv1
no-tlsv1_1

min-port=49152
max-port=65535

# 7 daily files via /etc/logrotate.d/coturn; nothing to the journal; never verbose.
log-file=/var/log/coturn/coturn.log
simple-log
no-stdout-log

no-auth-pings
no-multicast-peers
no-software-attribute

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

fingerprint
