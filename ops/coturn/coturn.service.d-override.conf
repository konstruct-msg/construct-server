# /etc/systemd/system/coturn.service.d/override.conf
# Creates /var/log/coturn owned by the unit's user at every start, so
# `log-file=/var/log/coturn/coturn.log` in turnserver.conf is writable. Without
# it coturn silently falls back to /var/tmp/turn_<pid>_<date>.log — one new file
# per restart, rotated by nothing.
[Service]
LogsDirectory=coturn
