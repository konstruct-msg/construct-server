# ============================================================================
# Coturn — a Konstruct call relay (reference: turn.ams.konstruct.cc on the prod host)
# ============================================================================
#
# coturn runs as a host systemd service, never in compose (construct-docs
# decisions/turn-host-systemd-not-in-compose). Every relay shares TURN_SECRET
# with signaling-service and nothing else; signaling lists the relays in
# TURN_HOSTS (app.env on the prod host — the list is not public).
#
# Install (replace turn.ams.konstruct.cc with this relay's name throughout):
#   sudo apt install -y coturn certbot
#   sudo cp ops/coturn/turnserver-prod.conf /etc/turnserver.conf
#   sudo sed -i "s/CHANGEME_SAME_AS_TURN_SECRET/$TURN_SECRET/" /etc/turnserver.conf
#   sudo install -d /etc/systemd/system/coturn.service.d
#   sudo cp ops/coturn/coturn.service.d-override.conf /etc/systemd/system/coturn.service.d/override.conf
#   sudo cp ops/coturn/coturn-logrotate /etc/logrotate.d/coturn
#   sudo systemctl daemon-reload
#   sudo systemctl enable --now coturn
#
# Firewall (ufw):
#   ufw allow 3478/udp
#   ufw allow 3478/tcp
#   ufw allow 5349/tcp
#   ufw allow 49152:65535/udp    # media relay range
#
# DNS: A record  turn.ams.konstruct.cc → this host's public IP
#
# TLS cert for 5349. coturn 4.6 reloads cert and key on SIGUSR2, so renewal
# never restarts the relay (a restart drops every call in progress).
#   - host where :80 is free:
#       certbot certonly --standalone -d turn.ams.konstruct.cc \
#         --deploy-hook 'systemctl kill -s SIGUSR2 coturn'
#   - prod host (Caddy owns :80; it serves the challenge dir — see ops/Caddyfile):
#       install -d /var/lib/construct/acme-webroot
#       certbot certonly --webroot -w /var/lib/construct/acme-webroot \
#         -d turn.ams.konstruct.cc --deploy-hook 'systemctl kill -s SIGUSR2 coturn'
#   Debian's package makes /etc/letsencrypt/live and archive group-readable by
#   `turnserver`; check `sudo -u turnserver cat <pkey>` works after issuance.
#
# Behind NAT (most cloud VMs): uncomment external-ip. Without it the relay
# advertises its private address and media never flows.
# ============================================================================

listening-port=3478
tls-listening-port=5349

# external-ip=<PUBLIC_IP>/<INTERNAL_IP>   # NAT
# external-ip=<PUBLIC_IP>                 # single public IP, no NAT (prod host)

realm=konstruct.cc

# HMAC-SHA1 temporary credentials (RFC 8489 / TURN REST). Must equal
# TURN_SECRET in signaling-service env. The username signaling issues is
# `<expiry>:<random label>` — no account appears on the wire or in this log.
use-auth-secret
static-auth-secret=CHANGEME_SAME_AS_TURN_SECRET

# TLS certificates (Let's Encrypt)
cert=/etc/letsencrypt/live/turn.ams.konstruct.cc/fullchain.pem
pkey=/etc/letsencrypt/live/turn.ams.konstruct.cc/privkey.pem

# Strong TLS only — no legacy ciphers
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
no-tlsv1
no-tlsv1_1

# UDP relay port range
min-port=49152
max-port=65535

# Logging. One file, rotated daily and kept 7 days by /etc/logrotate.d/coturn
# (ops/coturn/coturn-logrotate) — the retention the privacy policy §2.3 states.
# `simple-log` = no pid/date in the file name, so logrotate can truncate it;
# `no-stdout-log` = nothing duplicated into the journal (which has its own,
# size-based retention). Never `verbose` in production: it logs every
# allocation with both peer addresses.
log-file=/var/log/coturn/coturn.log
simple-log
no-stdout-log

# Security
no-auth-pings
no-multicast-peers
no-software-attribute

# SSRF protection: block relay to RFC-1918 + loopback + link-local
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Fingerprint in TURN messages (recommended)
fingerprint
