# =============================================================================
# Per-service secret allowlist
# =============================================================================
#
# Source of truth for humans remains /opt/construct/secrets/app.env.
# scripts/split-secrets.sh intersects this file with app.env and writes
# slices/<service>.env. Do not hand-edit the slices.
#
# Format: INI-ish, no quotes, no nested sections.
#   [config_common]            keys merged into every service listed under
#                              [inherit_config_common]
#   [inherit_config_common]    one service name per line
#   [<service>]                extra keys that service may receive
#   [private]                  KEY=svc,svc  — a generated slice for any other
#                              service that contains KEY is a hard error
#
# A key listed here but absent from app.env is skipped (optional / feature-off).
# Empty values in app.env are skipped so the var stays unset, not set-to-empty.
#
# v1 keeps Config::from_env() required secrets (HMAC trio, CSRF, DB/Redis URLs,
# LOG_HASH_SALT, public verify keys) on every service that calls it. Private
# signing / issuer / transport keys are withheld. Shrinking the common set is
# construct-docs decisions/secrets-are-sliced-not-shared.md phase 2.
# =============================================================================

[config_common]
DATABASE_URL
REDIS_URL
USERNAME_HMAC_SECRET
CONTACT_HMAC_SECRET
REQUEST_ENVELOPE_KEY
LOG_HASH_SALT
CSRF_SECRET
PASETO_PUBLIC_KEY
PASETO_PUBLIC_KEY_PREVIOUS
JWT_PUBLIC_KEY
JWT_ISSUER
TOKEN_ISSUE_FORMAT

[inherit_config_common]
identity
messaging
key
group
media
signaling
gateway
veil

# ── identity-service: issues tokens, sender certs, Privacy Pass ──────────────
[identity]
PASETO_PRIVATE_KEY
JWT_PRIVATE_KEY
SERVER_SIGNING_KEY
TOKEN_ISSUER_KEY
TOKEN_ISSUER_KEY_VERSION
BUNDLE_SIGNING_KEY
BUNDLE_SIGNING_PUBLIC_KEY

# ── messaging-service: redeems PP, token-enc, APNs ───────────────────────────
[messaging]
SERVER_SIGNING_KEY
TOKEN_ISSUER_KEY
TOKEN_ISSUER_KEY_VERSION
APNS_BUNDLE_ID
APNS_KEY_ID
APNS_KEY_PATH
APNS_TEAM_ID
APNS_TOPIC
APNS_VOIP_TOPIC
APNS_DEVICE_TOKEN_ENCRYPTION_KEY

# ── key-service: signs prekey bundles ────────────────────────────────────────
[key]
BUNDLE_SIGNING_KEY
BUNDLE_SIGNING_PUBLIC_KEY

# ── group-service: MLS + channels; auth verify only ──────────────────────────
[group]

# ── media-service: upload HMAC (mint + verify live here, not elsewhere) ──────
[media]
MEDIA_HMAC_SECRET
MEDIA_UPLOAD_TOKEN_SECRET

# ── signaling-service: TURN temporary credentials ────────────────────────────
[signaling]
TURN_SECRET
TURN_CREDENTIALS_TTL_SECONDS

# ── gateway: well-known commitments + ICE/obfs4 identity ─────────────────────
[gateway]
SERVER_SIGNING_KEY
TOKEN_ISSUER_KEY
TOKEN_ISSUER_KEY_VERSION
BUNDLE_SIGNING_PUBLIC_KEY
ICE_SERVER_KEY
ICE_IAT_MODE
ICE_COVER_UPSTREAM
VEIL_ENABLED
VEIL_PORT
VEIL_SERVER_KEY
VEIL_TLS_CERT_PATH
VEIL_TLS_KEY_PATH
VEIL_COVER_UPSTREAM
VEIL_RELAY_ADDRESSES

# ── veil-service: capability issuer seed ─────────────────────────────────────
[veil]
VEIL_ISSUER_SEED
VEIL_RELAYS
VEIL_RELAY_ADDRESS
VEIL_RELAY_SCOPE
VEIL_RELAY_SPKI
VEIL_RELAY_SNI
VEIL_BOOTSTRAP_VOUCHER
VEIL_VOUCHER_QUOTA

# ── quic (construct-transport): no app.env secrets; certs are a separate mount
[quic]

# ── masque-service: not in prod compose; listed so a future env_file is safe
[masque]
MASQUE_AUTH_TOKEN

# ── Private keys: must not appear in any slice except the services named ─────
# Comma-separated, no spaces. Splitter and preflight both enforce this even if
# a service section above accidentally lists the key.
[private]
PASETO_PRIVATE_KEY=identity
JWT_PRIVATE_KEY=identity
TOKEN_ISSUER_KEY=identity,messaging,gateway
SERVER_SIGNING_KEY=identity,messaging,gateway
BUNDLE_SIGNING_KEY=identity,key
VEIL_ISSUER_SEED=veil
ICE_SERVER_KEY=gateway
TURN_SECRET=signaling
APNS_DEVICE_TOKEN_ENCRYPTION_KEY=messaging
APNS_KEY_PATH=messaging
MEDIA_HMAC_SECRET=media
MEDIA_UPLOAD_TOKEN_SECRET=media
MASQUE_AUTH_TOKEN=masque
