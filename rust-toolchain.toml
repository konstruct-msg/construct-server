# Единственное место, где записана версия Rust для этого репозитория.
#
# До 2026-09-10 её не было нигде. CI ставит `dtolnay/rust-toolchain@stable`, то есть
# «то, что стабильно сегодня», а у участников стояло то, что стояло. Расхождение не
# теоретическое: ветка fix/privacy-pass-key-hygiene прошла локально `cargo clippy
# --all-targets -- -D warnings` начисто и упала в CI на `chunks_exact_to_as_chunks` —
# линте, появившемся в 1.98, при локальном тулчейне 1.92. Локальный pre-push хук гоняет
# clippy честно; он просто не мог знать о линте, которого в его версии не существует.
#
# rustup отдаёт приоритет этому файлу над toolchain по умолчанию, поэтому и CI, и
# рабочая машина считают одним и тем же компилятором, не сговариваясь. Компоненты
# перечислены здесь же: rustup доустановит их при первом обращении, иначе clippy может
# оказаться собран для stable, а cargo — вызываться под этой версией.
#
# Поднимать версию — отдельным коммитом, который прогоняет fmt + clippy + тесты, а не
# попутно с содержательной правкой: новый тулчейн приносит новые линты, и смешивать эти
# два вида падений значит не понять ни одного.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
