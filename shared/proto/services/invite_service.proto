syntax = "proto3";

package shared.proto.services.v1;

// InviteService — one-time contact invites (device-minted v4/v5).
//
// Product path: the client mints and signs the invite. v5 is the only version
// (since 2026-09-28): links use the server max TTL (INVITE_TTL_SECONDS = 43200),
// QR codes ttl=300, and every invite names the account's address (`addr`). The
// server first learns a jti when it is redeemed (AcceptInvite → burn) or
// revoked (RevokeInvite → pre-burn). No server-side issuance ledger / ListInvites
// (INVITE_LIST_REVOKE_SERVER_SPEC, server-influence-minimization).
service InviteService {
  // Accept and burn a device-minted invite token (one-time use).
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);

  // Pre-burn a jti so an unused invite cannot be redeemed.
  // Contract (iOS depends on each line — do not change casually):
  //   • unused jti → success=true
  //   • already redeemed / already revoked / unknown jti → success=false + message
  //     (normal outcome, not a gRPC error; UI: "already used")
  //   • transport / DB failure → Status::internal (client may retry)
  //   • burn retention = INVITE_BURN_RETENTION_SECONDS (derived from TTL)
  // No ownership check: jti is random UUIDv4 unknown until redeem/revoke;
  // holding the invite is enough to burn it (same as redeeming). Do not add
  // an issuance table to "fix" that.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
}

// ============================================================================
// AcceptInvite Messages
// ============================================================================

// Accept a device-minted invite.
message AcceptInviteRequest {
  InviteToken invite = 1;
}

// A device-minted invite, as the redeemer forwards it. The on-device transport is
// the compact binary "CIv1" layout; this message carries the same fields.
//
// Signed canonical string (v5, the only version accepted):
//   v|jti|uuid|device_id|server|ts|un|ttl|hex(addr)
// Vectors: conformance/knst_invite.json.
message InviteToken {
  // Protocol version. Only 5 is accepted.
  int32 v = 1;

  // JWT ID для one-time use tracking
  string jti = 2;

  // User ID создателя
  string uuid = 3;

  // Device ID создателя (v2 only)
  optional string device_id = 4;

  // Server FQDN
  string server = 5;

  // Unix timestamp создания
  int64 ts = 6;

  // v1–v3 only (an unused ephemeral key). Always empty on v5.
  string eph_pub = 7;

  // Ed25519 signature (64 bytes, base64)
  string sig = 8;

  // Username создателя (V3, optional - пустая строка если не установлен)
  optional string un = 9;

  // v5: client-stated maximum age in seconds (required on v=5). Covered by the
  // Ed25519 signature (canonical ends with |ttl). Server effective =
  // min(INVITE_TTL_SECONDS, ttl). Absent on v1–v4 → server max. Reject 0 and
  // ttl < 60. See INVITE_LIST_REVOKE_SERVER_SPEC §4.
  optional uint32 ttl = 10;

  // v5: the issuing account's address — its 32-byte Ed25519 recovery public key
  // (route_id = SHA-256(0x0001 || addr)). Required. Covered by the signature
  // (canonical ends with |hex(addr)), so the redeemer learns the address from the
  // issuer's device and not from the server. The server refuses an invite whose
  // addr is not the account's recovery key: a wrong address would otherwise
  // swallow every message sent to it without a word, since an unknown address is
  // accepted and dropped by design.
  // See construct-docs decisions/invite-carries-the-account-address.md.
  bytes addr = 11;
}

// Ответ после успешного принятия invite
message AcceptInviteResponse {
  // User ID добавленного контакта
  string user_id = 1;

  // Device ID (v2 only)
  optional string device_id = 2;

  // Server где находится пользователь
  string server = 3;

  // Сообщение для UI
  string message = 4;
}

// ============================================================================
// RevokeInvite Messages
// ============================================================================

// Запрос на отзыв invite token
message RevokeInviteRequest {
  // jti токена который нужно отозвать
  string jti = 1;
}

// Ответ на отзыв invite
message RevokeInviteResponse {
  // true если токен был отозван (burn row inserted)
  bool success = 1;

  // "Invite revoked" or "Invite not found or already used" (not a transport error)
  string message = 2;
}
