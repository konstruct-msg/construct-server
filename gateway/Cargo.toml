[package]
name = "gateway"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
default-run = "gateway"

[[bin]]
name = "gateway"
path = "src/main.rs"

[[bin]]
name = "construct-veil-keygen"
path = "src/bin/keygen.rs"

[dependencies]
construct-config = { path = "../crates/construct-config" }
construct-server-shared = { path = "../shared" }
construct-crypto = { path = "../crates/construct-crypto", features = ["full"] }
construct-federation = { path = "../crates/construct-federation" }

# Workspace deps
tokio = {workspace = true}
anyhow = {workspace = true}
serde_json = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
chrono = {workspace = true}
axum = {workspace = true}
tower-http = {workspace = true}

base64 = {workspace = true}

# Gateway specific
construct-veil = { git = "https://github.com/konstruct-msg/construct-veil.git", branch = "main" }

# TLS for VEIL-over-TLS (obfs4 inside TLS to defeat TSPU DPI)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

[dev-dependencies]
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
