[package]
name = "crypto-agility"
license = "AGPL-3.0-only"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = "2"
tokio = { version = "1.0", features = ["full"] }
