[package]
name = "crypto-agility"
license = "AGPL-3.0-only"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = "2"
