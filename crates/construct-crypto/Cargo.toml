[package]
name = "construct-crypto"
version = "0.6.0"
edition.workspace = true
authors = ["Construct Server Team"]
description = "Cryptographic primitives for Construct secure messaging server"
license = "AGPL-3.0-only"

[features]
default = ["full"]
full = ["pqc"]
pqc = ["post-quantum"]  # Post-quantum cryptography
post-quantum = [
    "dep:ml-dsa",
    "dep:construct-server-trust",
    "dep:rand_core",
]

[dependencies]
# Core crypto
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = { version = "4", features = ["digest", "rand_core"] }
chacha20poly1305 = "0.11"
# 0.10.0/0.10.1 are yanked (`cargo audit --deny warnings`). chacha20poly1305 0.11
# still declares `chacha20 = "0.10"`, so pin the patched release explicitly.
chacha20 = "0.10.2"
sha2 = "0.11"
# curve25519-dalek's `RistrettoPoint::from_hash` needs `digest` 0.10's `Digest` trait,
# which sha2 0.11 (used elsewhere in this crate) no longer implements. Pin a second,
# renamed sha2 dependency at 0.10 (same version construct-core uses) just for that call.
sha2-dalek-compat = { package = "sha2", version = "0.10" }
hkdf = "0.13"
hmac = "0.13"
subtle = "2.6"

# Encoding
base64 = "0.22"
hex = "0.4"

# Post-quantum cryptography (ML-DSA-65 for hybrid signatures)
# RustCrypto `ml-dsa` (maintained) — replaced the archived PQClean-based
# pqcrypto-mldsa/pqcrypto-traits crates (RUSTSEC-2026-0162/0166).
ml-dsa = { version = "0.1.1", optional = true }
# The bytes of a server signature — delegations from the offline root, labels, key ids — shared
# with construct-core and the root tool (decisions/server-keys-rooted-offline-and-hybrid.md).
construct-server-trust = { git = "https://github.com/konstruct-msg/construct-core", rev = "7daf9eda90f21278d9ced5d95a6f5d52fa99386d", optional = true }
zeroize = { workspace = true }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }

# Serialization
serde_json = "1.0"

# Utilities
anyhow = "1.0"
rand = "0.10"

# Makes a server key for the offline root to delegate; lists what is delegated.
[[bin]]
name = "server-trust-key"
required-features = ["pqc"]

# Deliberate version constraint: chacha20poly1305 0.11 permits yanked
# chacha20 0.10.0/0.10.1; keep the patched 0.10.2 floor for standalone builds.
[package.metadata.cargo-machete]
ignored = ["chacha20"]
